<html>
<head>
    <meta charset="utf-8">
    <meta property="og:site_name" content="YourMinecraftServerName">
    <meta property="og:type" content="website">
    <meta property="og:title" content="YourMinecraftServerName">
    <meta property="og:description" content="Visit YourMinecraftServerName's server website for more information">
    <meta id="meta-image" property="og:image" itemprop="image" content="../assets/cube.jpg">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1">
    <meta name="author" content="JerosGamer89">
    <meta name="keywords" content="mcserver,jerosgamer89">
    <meta name="description" content="YourMinecraftServerName website">
    <meta name="viewport" content="width=device-width">
    <title>Minecraft server</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="../assets/cube.jpg">
    <style>
        #server-ip { width: 350px; }
        #server-ip:focus { border-color: #ffff9b; }
        .connect-status { margin-top: 20px; font-family: 'Minecraft'; font-size: 16px; }
        #server-status { margin-top: 20px; font-family: 'Minecraft'; font-size: 16px; }
    </style>
</head>
<body class="mcsplashscreen">
    <h1>Start playing</h1>
    <div class="content">
        <p>
            <label for="server-ip">Server address (edit to join any server)</label><br>
            <input id="server-ip" type="text" autocomplete="off" spellcheck="false">
            <br>
            <label style="left: -142px;">Game mode</label><br>
            <input value="" id="server-modpack" readonly disabled>
            <br>
            <label style="left: -110px;">Allowed versions</label><br>
            <input value="" id="server-versions" readonly disabled>
        </p>

        <a class="mc-btn" style="margin: 2% 35% 0.5% 35%;" id="connect-btn" onclick="connectToServer()">Join Server</a>

        <div id="server-status" class="connect-status">
            Checking server status...
        </div>
    </div>

    <center><footer>
        <a href="https://minecraft.net/" class="mc-btn mc-half">Buy game</a>
        <a href="../" class="mc-btn mc-half">Done</a>
    </footer></center>

    <script src="../config.js"></script>
    <script>
        function initServer() {
            if (typeof SERVER_CONFIG === 'undefined') return;
            var cfg = SERVER_CONFIG;

            document.getElementById('server-ip').value = cfg.ip + ':' + (cfg.port || '25565');
            document.getElementById('server-modpack').value = cfg.modpack || '';
            document.getElementById('server-versions').value = cfg.versions || '';
        }

        function parseAddress() {
            var v = document.getElementById('server-ip').value.trim();
            if (!v) return null;
            var parts = v.split(':');
            return { ip: parts[0], port: parts[1] || '25565' };
        }

        function connectToServer() {
            var addr = parseAddress();
            if (!addr) return;
            var cfg = (typeof SERVER_CONFIG !== 'undefined') ? SERVER_CONFIG : {};
            var name = cfg.name || 'Server';
            var uri = 'minecraft://?addExternalServer=' +
                encodeURIComponent(name) + '|' +
                encodeURIComponent(addr.ip) + ':' + addr.port;
            var status = document.getElementById('server-status');
            status.innerHTML = 'Launching Minecraft and joining ' + addr.ip + ':' + addr.port + '...';
            window.location.href = uri;
        }

        /* Enter key also joins */
        document.getElementById('server-ip').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') connectToServer();
        });

        /* Live online/offline status + player count for the configured server.
           Uses the free public API at api.mcsrvstat.us */
        function checkStatus() {
            var statusEl = document.getElementById('server-status');
            var cfg = SERVER_CONFIG;
            if (!cfg || !cfg.ip) { statusEl.innerHTML = 'No server configured.'; return; }
            var host = cfg.ip + ':' + (cfg.port || '25565');
            var req = new XMLHttpRequest();
            req.open('GET', 'https://api.mcsrvstat.us/3/' + encodeURIComponent(host));
            req.timeout = 8000;
            req.onload = function () {
                try {
                    var data = JSON.parse(req.responseText);
                    if (data.online) {
                        var players = (data.players && data.players.online) || 0;
                        var max = (data.players && data.players.max) || 0;
                        statusEl.innerHTML = '<span style="color:#5eff6b;">ONLINE</span> — ' +
                            players + ' / ' + max + ' players online';
                    } else {
                        statusEl.innerHTML = '<span style="color:#ff8d8d;">OFFLINE</span> — could not reach the server';
                    }
                } catch (e) {
                    statusEl.innerHTML = 'Unable to check status.';
                }
            };
            req.onerror = function () { statusEl.innerHTML = 'Unable to check status.'; };
            req.ontimeout = function () { statusEl.innerHTML = 'Status check timed out.'; };
            req.send();
        }

        initServer();
        checkStatus();
    </script>
</body>
</html>
