<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 - Kaid Gaming</title>
<style>
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #1a1a2e;
    font-family: 'Segoe UI', sans-serif;
  }
  .game-container {
    text-align: center;
  }
  .score {
    color: #4ecca3;
    font-size: 24px;
    margin: 10px 0;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 100px);
    gap: 10px;
    background: #16213e;
    padding: 10px;
    border-radius: 8px;
    border: 3px solid #4ecca3;
  }
  .cell {
    width: 100px;
    height: 100px;
    background: #0f3460;
    border-radius: 5px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 32px;
    font-weight: bold;
    color: #eee;
  }
  .cell-2 { background: #eee4da; color: #776e65; }
  .cell-4 { background: #ede0c8; color: #776e65; }
  .cell-8 { background: #f2b179; color: #f9f6f2; }
  .cell-16 { background: #f59563; color: #f9f6f2; }
  .cell-32 { background: #f67c5f; color: #f9f6f2; }
  .cell-64 { background: #f65e3b; color: #f9f6f2; }
  .cell-128 { background: #edcf72; color: #f9f6f2; }
  .cell-256 { background: #edcc61; color: #f9f6f2; }
  .cell-512 { background: #edc850; color: #f9f6f2; }
  .cell-1024 { background: #edc53f; color: #f9f6f2; }
  .cell-2048 { background: #edc22e; color: #f9f6f2; }
  .controls {
    color: #eee;
    margin-top: 10px;
  }
</style>
</head>
<body>
<div class="game-container">
  <div class="score">Score: <span id="score">0</span></div>
  <div class="grid" id="grid"></div>
  <div class="controls">Use Arrow Keys to move</div>
</div>
<script>
  const gridEl = document.getElementById('grid');
  const scoreEl = document.getElementById('score');
  
  let grid = Array(4).fill(null).map(() => Array(4).fill(0));
  let score = 0;
  
  const COLORS = {
    0: '', 2: 'cell-2', 4: 'cell-4', 8: 'cell-8', 16: 'cell-16',
    32: 'cell-32', 64: 'cell-64', 128: 'cell-128', 256: 'cell-256',
    512: 'cell-512', 1024: 'cell-1024', 2048: 'cell-2048'
  };
  
  function init() {
    addRandomTile();
    addRandomTile();
    render();
  }
  
  function addRandomTile() {
    const empty = [];
    for (let y = 0; y < 4; y++) {
      for (let x = 0; x < 4; x++) {
        if (grid[y][x] === 0) empty.push({x, y});
      }
    }
    if (empty.length > 0) {
      const {x, y} = empty[Math.floor(Math.random() * empty.length)];
      grid[y][x] = Math.random() < 0.9 ? 2 : 4;
    }
  }
  
  function render() {
    gridEl.innerHTML = '';
    for (let y = 0; y < 4; y++) {
      for (let x = 0; x < 4; x++) {
        const cell = document.createElement('div');
        cell.className = 'cell ' + (COLORS[grid[y][x]] || '');
        cell.textContent = grid[y][x] || '';
        gridEl.appendChild(cell);
      }
    }
    scoreEl.textContent = score;
  }
  
  function slide(row) {
    let arr = row.filter(val => val);
    let missing = 4 - arr.length;
    let zeros = Array(missing).fill(0);
    return arr.concat(zeros);
  }
  
  function combine(row) {
    for (let i = 0; i < 3; i++) {
      if (row[i] !== 0 && row[i] === row[i + 1]) {
        row[i] *= 2;
        row[i + 1] = 0;
        score += row[i];
      }
    }
    return row;
  }
  
  function move(direction) {
    let moved = false;
    let newGrid = grid.map(row => [...row]);
    
    if (direction === 'left') {
      for (let y = 0; y < 4; y++) {
        let row = slide(newGrid[y]);
        row = combine(row);
        row = slide(row);
        newGrid[y] = row;
      }
    } else if (direction === 'right') {
      for (let y = 0; y < 4; y++) {
        let row = slide(newGrid[y].reverse());
        row = combine(row);
        row = slide(row);
        newGrid[y] = row.reverse();
      }
    } else if (direction === 'up') {
      for (let x = 0; x < 4; x++) {
        let col = [];
        for (let y = 0; y < 4; y++) col.push(newGrid[y][x]);
        col = slide(col);
        col = combine(col);
        col = slide(col);
        for (let y = 0; y < 4; y++) newGrid[y][x] = col[y];
      }
    } else if (direction === 'down') {
      for (let x = 0; x < 4; x++) {
        let col = [];
        for (let y = 0; y < 4; y++) col.push(newGrid[y][x]);
        col = slide(col.reverse());
        col = combine(col);
        col = slide(col);
        col = col.reverse();
        for (let y = 0; y < 4; y++) newGrid[y][x] = col[y];
      }
    }
    
    for (let y = 0; y < 4; y++) {
      for (let x = 0; x < 4; x++) {
        if (newGrid[y][x] !== grid[y][x]) moved = true;
      }
    }
    
    if (moved) {
      grid = newGrid;
      addRandomTile();
      render();
      
      if (grid.flat().every(val => val !== 0) && !canMove()) {
        alert('Game Over! Score: ' + score);
        reset();
      }
    }
  }
  
  function canMove() {
    for (let y = 0; y < 4; y++) {
      for (let x = 0; x < 4; x++) {
        if (grid[y][x] === 0) return true;
        if (x < 3 && grid[y][x] === grid[y][x + 1]) return true;
        if (y < 3 && grid[y][x] === grid[y + 1][x]) return true;
      }
    }
    return false;
  }
  
  function reset() {
    grid = Array(4).fill(null).map(() => Array(4).fill(0));
    score = 0;
    init();
  }
  
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') move('left');
    else if (e.key === 'ArrowRight') move('right');
    else if (e.key === 'ArrowUp') move('up');
    else if (e.key === 'ArrowDown') move('down');
  });
  
  init();
</script>
</body>
</html>
