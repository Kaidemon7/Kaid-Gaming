<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake - Kaid Gaming</title>
<style>
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #1a1a2e;
    font-family: 'Segoe UI', sans-serif;
  }
  .game-container {
    text-align: center;
  }
  canvas {
    border: 3px solid #4ecca3;
    border-radius: 8px;
    background: #16213e;
  }
  .score {
    color: #4ecca3;
    font-size: 24px;
    margin: 10px 0;
  }
  .controls {
    color: #eee;
    margin-top: 10px;
  }
</style>
</head>
<body>
<div class="game-container">
  <div class="score">Score: <span id="score">0</span></div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div class="controls">Use Arrow Keys or WASD to move</div>
</div>
<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  
  const gridSize = 20;
  const tileCount = canvas.width / gridSize;
  
  let snake = [{x: 10, y: 10}];
  let food = {x: 15, y: 15};
  let dx = 0;
  let dy = 0;
  let score = 0;
  let gameLoop;
  
  document.addEventListener('keydown', changeDirection);
  
  function changeDirection(e) {
    const key = e.key.toLowerCase();
    if ((key === 'arrowleft' || key === 'a') && dx !== 1) {
      dx = -1; dy = 0;
    } else if ((key === 'arrowright' || key === 'd') && dx !== -1) {
      dx = 1; dy = 0;
    } else if ((key === 'arrowup' || key === 'w') && dy !== 1) {
      dx = 0; dy = -1;
    } else if ((key === 'arrowdown' || key === 's') && dy !== -1) {
      dx = 0; dy = 1;
    }
  }
  
  function drawGame() {
    moveSnake();
    let result = isGameOver();
    if (result) return;
    clearCanvas();
    drawFood();
    drawSnake();
  }
  
  function clearCanvas() {
    ctx.fillStyle = '#16213e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  
  function drawSnake() {
    snake.forEach((part, index) => {
      ctx.fillStyle = index === 0 ? '#4ecca3' : '#45b390';
      ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
    });
  }
  
  function moveSnake() {
    const head = {x: snake[0].x + dx, y: snake[0].y + dy};
    snake.unshift(head);
    
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      generateFood();
    } else {
      snake.pop();
    }
  }
  
  function drawFood() {
    ctx.fillStyle = '#e94560';
    ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
  }
  
  function generateFood() {
    food = {
      x: Math.floor(Math.random() * tileCount),
      y: Math.floor(Math.random() * tileCount)
    };
    snake.forEach(part => {
      if (part.x === food.x && part.y === food.y) generateFood();
    });
  }
  
  function isGameOver() {
    for (let i = 4; i < snake.length; i++) {
      if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
    }
    const hitLeftWall = snake[0].x < 0;
    const hitRightWall = snake[0].x > tileCount - 1;
    const hitTopWall = snake[0].y < 0;
    const hitBottomWall = snake[0].y > tileCount - 1;
    return hitLeftWall || hitRightWall || hitTopWall || hitBottomWall;
  }
  
  function resetGame() {
    snake = [{x: 10, y: 10}];
    dx = 0; dy = 0;
    score = 0;
    scoreEl.textContent = score;
    generateFood();
  }
  
  generateFood();
  gameLoop = setInterval(drawGame, 100);
  
  canvas.addEventListener('click', () => {
    if (isGameOver()) resetGame();
  });
</script>
</body>
</html>
