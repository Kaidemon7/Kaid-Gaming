<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe - Kaid Gaming</title>
<style>
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #1a1a2e;
    font-family: 'Segoe UI', sans-serif;
  }
  .game-container {
    text-align: center;
  }
  .status {
    color: #4ecca3;
    font-size: 24px;
    margin: 10px 0;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    gap: 5px;
    background: #16213e;
    padding: 10px;
    border-radius: 8px;
    border: 3px solid #4ecca3;
  }
  .cell {
    width: 100px;
    height: 100px;
    background: #0f3460;
    border-radius: 5px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 48px;
    font-weight: bold;
    cursor: pointer;
    color: #eee;
  }
  .cell:hover {
    background: #1a4a7a;
  }
  .cell.x { color: #4ecca3; }
  .cell.o { color: #e94560; }
  .controls {
    color: #eee;
    margin-top: 10px;
  }
  button {
    background: #4ecca3;
    color: #1a1a2e;
    border: none;
    padding: 10px 20px;
    font-size: 16px;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 10px;
  }
  button:hover {
    background: #45b390;
  }
</style>
</head>
<body>
<div class="game-container">
  <div class="status" id="status">Player X's Turn</div>
  <div class="grid" id="grid"></div>
  <button onclick="resetGame()">Reset Game</button>
</div>
<script>
  const gridEl = document.getElementById('grid');
  const statusEl = document.getElementById('status');
  
  let board = Array(9).fill('');
  let currentPlayer = 'X';
  let gameActive = true;
  
  const WINNING_COMBINATIONS = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8],
    [0, 3, 6], [1, 4, 7], [2, 5, 8],
    [0, 4, 8], [2, 4, 6]
  ];
  
  function init() {
    gridEl.innerHTML = '';
    for (let i = 0; i < 9; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.addEventListener('click', () => makeMove(i));
      gridEl.appendChild(cell);
    }
  }
  
  function makeMove(index) {
    if (board[index] !== '' || !gameActive) return;
    
    board[index] = currentPlayer;
    updateCell(index);
    
    if (checkWin()) {
      statusEl.textContent = `Player ${currentPlayer} Wins!`;
      gameActive = false;
      return;
    }
    
    if (board.every(cell => cell !== '')) {
      statusEl.textContent = "It's a Draw!";
      gameActive = false;
      return;
    }
    
    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
    statusEl.textContent = `Player ${currentPlayer}'s Turn`;
  }
  
  function updateCell(index) {
    const cells = gridEl.children;
    cells[index].textContent = board[index];
    cells[index].classList.add(board[index].toLowerCase());
  }
  
  function checkWin() {
    return WINNING_COMBINATIONS.some(combination => {
      return combination.every(index => board[index] === currentPlayer);
    });
  }
  
  function resetGame() {
    board = Array(9).fill('');
    currentPlayer = 'X';
    gameActive = true;
    statusEl.textContent = "Player X's Turn";
    init();
  }
  
  init();
</script>
</body>
</html>
